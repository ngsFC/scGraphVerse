# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master, devel]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Installed *after* setup-r-dependencies: that step's apt system
      # dependencies can pull in Ubuntu's old pandoc (2.9.x) and silently
      # overwrite a pandoc installed earlier, which breaks rendering with
      # newer rmarkdown (see https://github.com/r-lib/actions/issues/710).
      - uses: r-lib/actions/setup-pandoc@v2

      # pkgdown renders each vignette in an isolated callr::r_safe()
      # subprocess, which strips RSTUDIO_PANDOC (the var setup-pandoc uses
      # to point rmarkdown at the right binary). Without it, that
      # subprocess falls back to a bare PATH search and can pick up an
      # old system pandoc. Symlinking into /usr/local/bin (which wins over
      # /usr/bin even under a minimal PATH) and removing any apt pandoc
      # makes sure only the modern one is ever reachable.
      - name: Make modern pandoc the only one reachable
        run: |
          PANDOC_BIN=$(command -v pandoc)
          echo "setup-pandoc installed: $PANDOC_BIN"
          "$PANDOC_BIN" --version | head -1
          sudo apt-get remove -y pandoc pandoc-data 2>/dev/null || true
          sudo ln -sf "$PANDOC_BIN" /usr/local/bin/pandoc
          echo "Resolved pandoc after fix: $(command -v pandoc)"
          pandoc --version | head -1

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
